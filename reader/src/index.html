<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Instead</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="main.js"></script>
</head>
<body>
<main id="shelf">
    <h1>Read Instead</h1>
    <div class="grid">
        <div class="empty" hidden>
            <div class="qr"></div>
            <div>
                <p class="hint"></p>
                <p class="address"></p>
            </div>
        </div>
        <button id="add-books" class="tile">
            <span class="cover add" aria-hidden="true">+</span>
            <span class="title">Add books</span>
            <span class="author">From your phone</span>
        </button>
    </div>
</main>
<section id="add-books-screen" hidden>
    <h1>Add books</h1>
    <div class="qr"></div>
    <p class="hint"></p>
    <p class="address"></p>
    <button id="reset-key">Reset key</button>
</section>
<section id="reader" hidden>
    <div id="stage"></div>
    <output id="hud"></output>
</section>
<output id="toast" hidden></output>
</body>
</html>
