<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Instead</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="main.js"></script>
</head>
<body>
<main id="shelf">
    <h1>Read Instead</h1>
    <div class="grid">
        <div class="empty" hidden>
            <div class="qr"></div>
            <div>
                <p class="hint"></p>
                <p class="address"></p>
            </div>
        </div>
        <button id="add-books" class="tile">
            <span class="cover add" aria-hidden="true">+</span>
            <span class="title">Add books</span>
            <span class="author">From your phone</span>
        </button>
    </div>
</main>
<section id="add-books-screen" hidden>
    <h1>Add books</h1>
    <div class="qr"></div>
    <p class="hint"></p>
    <p class="address"></p>
    <button id="reset-key">Reset key</button>
</section>
<section id="reader" hidden>
    <header id="top-bar">
        <div class="progress"><span></span></div>
        <div class="status"></div>
        <div class="buttons" hidden>
            <button data-action="contents">Contents</button>
            <button data-action="font">Font</button>
            <button data-action="theme">Theme</button>
            <button data-action="go-to">Go to %</button>
            <button data-action="pairing" data-format="pdf">Pairing</button>
            <button data-action="fit-width" data-format="pdf">Fit-width</button>
            <button data-action="hide">Hide bar</button>
            <button data-action="shelf">Shelf</button>
        </div>
        <button class="return" data-action="return" hidden></button>
    </header>
    <div id="stage"></div>
    <section id="contents" class="overlay" hidden>
        <h2>Contents</h2>
        <ol></ol>
        <p class="empty">This book has no contents.</p>
    </section>
    <section id="go-to" class="overlay" hidden>
        <div class="readout"><span class="percent"></span><span class="chapter"></span></div>
        <div class="track"><span class="fill"></span><span class="thumb"></span></div>
    </section>
    <section id="font" class="overlay look" hidden></section>
    <section id="theme" class="overlay look" hidden></section>
    <output id="hud"></output>
</section>
<output id="toast" hidden></output>
</body>
</html>
