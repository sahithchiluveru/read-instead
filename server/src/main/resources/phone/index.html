<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4ECD8">
<title>Read Instead</title>
<style>
    :root { --bg: #F4ECD8; --text: #3D2F23; --dim: #7A6650; --accent: #A65A2A; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 17px/1.5 Georgia, serif; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .status { color: var(--dim); margin: 0 0 24px; }
    .status::before { content: '●'; color: #4C8A4C; margin-right: 6px; }
    .banner { display: none; padding: 16px; border-radius: 12px; background: #fff6e6; border: 2px solid var(--accent); }
    .banner h2 { font-size: 18px; margin: 0 0 4px; }
    .banner p { margin: 0; color: var(--dim); }
    body.unreachable .banner.unreachable, body.locked-out .banner.locked-out { display: block; }
    body.unreachable .status, body.locked-out .status, body.unreachable .upload, body.locked-out .upload { display: none; }
    .pick { display: block; padding: 18px; border-radius: 12px; background: var(--accent); color: #fff;
        font: 600 18px system-ui, sans-serif; text-align: center; }
    .pick input { display: none; }
    .uploads { list-style: none; margin: 20px 0 0; padding: 0; }
    .uploads li { padding: 12px 0; border-bottom: 1px solid #0001; }
    .uploads .name { overflow-wrap: anywhere; }
    .uploads progress { display: block; width: 100%; height: 6px; margin: 8px 0 4px; accent-color: var(--accent); }
    .uploads .result { color: var(--dim); font: 15px system-ui, sans-serif; }
    .uploads .failed .result { color: #A33; }
</style>
</head>
<body>
<h1>Read Instead</h1>
<p class="status">Connected to your TV</p>
<section class="upload">
    <label class="pick">Upload books
        <input type="file" multiple accept=".epub,.pdf,application/epub+zip,application/pdf">
    </label>
    <ul class="uploads"></ul>
</section>
<section class="banner unreachable" role="alert">
    <h2>TV app not reachable</h2>
    <p>Open Read Instead on the TV, on the same Wi-Fi as this phone. This page reconnects by itself.</p>
</section>
<section class="banner locked-out" role="alert">
    <h2>Disconnected</h2>
    <p>The TV's key was reset. Scan the QR code on the TV's Add books screen to connect again.</p>
</section>
<script>
    // Uploads go one file at a time, each its own request, so each gets its own progress bar.
    const picker = document.querySelector('.pick input')
    const list = document.querySelector('.uploads')
    const supported = name => /\.(epub|pdf)$/i.test(name)
    const messages = {
        added: book => book.unreadable ? "Added, but the TV couldn't open this book" : 'Added to your shelf',
        duplicate: () => 'Already on your shelf',
        unsupported: () => 'Only EPUB and PDF are supported',
    }
    let queue = Promise.resolve()

    const upload = (file, row) => new Promise(resolve => {
        const progress = row.querySelector('progress')
        const show = (text, failed = false) => {
            progress.remove()
            row.querySelector('.result').textContent = text
            row.classList.toggle('failed', failed)
            resolve()
        }
        const request = new XMLHttpRequest()
        request.open('POST', '/api/books')
        request.upload.onprogress = e => { if (e.lengthComputable) progress.value = e.loaded / e.total }
        request.onload = () => {
            if (request.status === 401) return show('Disconnected: scan the QR code on the TV again', true)
            if (request.status !== 200) return show("The TV couldn't save this book", true)
            const [result] = JSON.parse(request.responseText).results
            show(messages[result.status](result.book), result.status === 'unsupported')
        }
        request.onerror = () => show('Upload failed: is Read Instead still open on the TV?', true)
        const form = new FormData()
        form.append('books', file, file.name)
        request.send(form)
    })

    picker.addEventListener('change', () => {
        for (const file of picker.files) {
            const row = document.createElement('li')
            row.innerHTML = '<div class="name"></div><progress max="1" value="0"></progress><div class="result">Waiting…</div>'
            row.querySelector('.name').textContent = file.name
            list.prepend(row)
            if (!supported(file.name)) {
                row.querySelector('progress').remove()
                row.querySelector('.result').textContent = messages.unsupported()
                row.classList.add('failed')
                continue
            }
            queue = queue.then(() => {
                row.querySelector('.result').textContent = 'Uploading…'
                return upload(file, row)
            })
        }
        picker.value = ''
    })

    // The TV app only serves this page while it's open, so keep checking it's still there.
    const check = async () => {
        let state = ''
        try {
            const response = await fetch('/api/ping', { cache: 'no-store' })
            if (response.status === 401) state = 'locked-out'
            else if (!response.ok) state = 'unreachable'
        } catch {
            state = 'unreachable'
        }
        document.body.className = state
    }
    setInterval(check, 5000)
    addEventListener('visibilitychange', () => document.visibilityState === 'visible' && check())
    addEventListener('online', check)
</script>
</body>
</html>
